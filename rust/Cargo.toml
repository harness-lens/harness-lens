[workspace]
members = [
  "crates/harness-lens",
  "crates/harness-lens-adapter-harness-score",
  "crates/harness-lens-config",
  "crates/harness-lens-core",
  "crates/harness-lens-cli",
  "crates/harness-lens-lsp",
  "crates/harness-lens-python",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Cristian Camargo Filho <ccf@cdone.com.br>"]
license = "MPL-2.0"
repository = "https://github.com/harness-lens/harness-lens"
homepage = "https://github.com/harness-lens/harness-lens"

[workspace.dependencies]
harness-lens = { version = "0.0.1", path = "crates/harness-lens" }
harness-lens-config = { version = "0.0.1", path = "crates/harness-lens-config" }
harness-lens-core = { version = "0.0.1", path = "crates/harness-lens-core" }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
