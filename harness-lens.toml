version = 1

[discovery]
file_names = ["AGENTS.md", "CLAUDE.md", "GEMINI.md"]
path_suffixes = [".github/copilot-instructions.md"]
directory_suffixes = [".cursor/rules"]
ignored_directories = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "node_modules",
  "target",
  "venv",
]
max_file_bytes = 1048576
max_files = 1000000
follow_symlinks = false

[[plugins]]
id = "harness-lens.inventory"
enabled = true

[[plugins]]
id = "harness-lens.repetition"
enabled = true

[[plugins]]
id = "harness-lens.incongruence"
enabled = true

[[integrations]]
id = "harness-score"
enabled = false

[integrations.options]
project = "harness-lens"
