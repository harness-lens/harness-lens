name: Test Suite

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Lint all targets
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        working-directory: rust
        run: cargo test --workspace --locked

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and tests
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Run tests
        run: python -m pytest

      - name: Run CLI smoke test
        run: python -m harness_lens --version

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run installed CLI
        run: harness-lens --version
