name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            interpreter: python3.10
          - os: macos-latest
            interpreter: python
          - os: windows-latest
            interpreter: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --compatibility pypi -i ${{ matrix.interpreter }} --out dist
          manylinux: "2_17"
          maturin-version: v1.15.0

      - name: Store wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --manifest-path rust/crates/harness-lens-python/Cargo.toml --out dist
          maturin-version: v1.15.0

      - name: Store source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate distributions
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true

      - name: Validate distribution metadata
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check --strict dist/*

  publish:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/harness-lens
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
