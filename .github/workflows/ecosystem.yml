name: Ecosystem pins

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify pinned repositories
        run: git submodule status --recursive
      - name: Verify clean composition
        run: git diff --exit-code --submodule=short
