[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-lens"
version = "0.0.1"
description = "Inspect coding-agent harness files in a repository."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Cristian Camargo Filho" },
]
keywords = ["agents", "developer-tools", "harness", "linting"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
dev = [
  "build>=1.3",
  "pytest>=8,<10",
  "twine>=6",
]

[project.scripts]
harness-lens = "harness_lens.cli:main"

[project.urls]
Homepage = "https://github.com/harness-lens/harness-lens"
Documentation = "https://github.com/harness-lens/harness-lens#readme"
Issues = "https://github.com/harness-lens/harness-lens/issues"
Repository = "https://github.com/harness-lens/harness-lens"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
